<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetworkFast</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="NetworkFast">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #111;
      min-height: 100dvh;
      padding: 24px 16px 48px;
    }

    h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    #disclaimer {
      font-size: 0.75rem;
      color: #999;
      line-height: 1.5;
      margin-bottom: 20px;
      max-width: 480px;
    }

    #tabs {
      display: flex;
      max-width: 480px;
      border-bottom: 2px solid #ddd;
      margin-bottom: 24px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -2px;
      cursor: pointer;
      color: #888;
      transition: color 0.15s;
    }

    .tab.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-width: 480px;
    }

    label {
      display: flex;
      flex-direction: column;
      gap: 5px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
    }

    input, textarea {
      font-family: inherit;
      font-size: 1rem;
      padding: 12px 14px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      background: #fff;
      color: #111;
      outline: none;
      transition: border-color 0.15s;
      width: 100%;
    }

    input:focus, textarea:focus {
      border-color: #2563eb;
    }

    textarea {
      resize: vertical;
      min-height: 90px;
    }

    button[type="submit"] {
      margin-top: 6px;
      padding: 16px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:active {
      background: #1d4ed8;
      transform: scale(0.98);
    }

    #contact-list {
      max-width: 480px;
    }

    #contact-list h2 {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #555;
      margin-bottom: 10px;
    }

    #search {
      margin-bottom: 10px;
    }

    #contact-list ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #contact-list li {
      background: #fff;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      padding: 12px 14px;
    }

    .contact-header {
      cursor: pointer;
    }

    .contact-name {
      font-size: 1rem;
      font-weight: 600;
    }

    .contact-meta {
      font-size: 0.85rem;
      color: #666;
      margin-top: 2px;
    }

    .contact-edit {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid #eee;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .contact-edit label {
      font-size: 0.7rem;
    }

    .contact-edit input,
    .contact-edit textarea {
      font-size: 0.95rem;
      padding: 10px 12px;
    }

    .contact-edit textarea {
      min-height: 70px;
    }

    .contact-actions {
      display: flex;
      gap: 8px;
      margin-top: 2px;
    }

    .btn-update {
      flex: 1;
      padding: 12px;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-update:active {
      background: #1d4ed8;
    }

    .btn-delete {
      padding: 10px 14px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      background: #fff;
      color: #dc2626;
      border: 1.5px solid #fecaca;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-delete:active {
      background: #fef2f2;
    }

    #milestone {
      margin-bottom: 16px;
      max-width: 480px;
    }

    #milestone-count {
      font-size: 0.9rem;
      font-weight: 600;
      color: #333;
    }

    #milestone-msg {
      font-size: 0.85rem;
      color: #777;
      margin-top: 3px;
      white-space: pre-line;
    }

    #saved-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      max-width: 480px;
      margin-bottom: 16px;
    }

    #saved-header #milestone {
      flex: 1;
      min-width: 0;
      margin-bottom: 0;
    }

    #export-btn {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      padding: 0;
      border-radius: 50%;
      background: none;
      border: 1.5px solid #ddd;
      color: #888;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    #export-btn:active {
      background: #f0f0f0;
      color: #555;
    }

    #export-btn svg {
      width: 18px;
      height: 18px;
    }

    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #111;
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>
  <h1>NetworkFast</h1>
  <p id="disclaimer">Vibe-coded for Tech X 2026.<br>All notes are saved locally on this device.</p>

  <nav id="tabs">
    <button class="tab active" id="tab-add">Add</button>
    <button class="tab" id="tab-saved">Saved</button>
  </nav>

  <div id="panel-add">
    <form id="contact-form" novalidate>
      <label>
        Name *
        <input type="text" id="name" name="name" placeholder="Full name" autocomplete="off" required>
      </label>
      <label>
        Team / Org
        <input type="text" id="team" name="team" placeholder="Organization / Team" autocomplete="off">
      </label>
      <label>
        Role
        <input type="text" id="title" name="title" placeholder="What they work on" autocomplete="off">
      </label>
      <label>
        Notes
        <textarea id="notes" name="notes" placeholder="How you met, interesting topics, follow-ups, random context..."></textarea>
      </label>
      <button type="submit" id="save-btn">Save</button>
    </form>
  </div>

  <div id="panel-saved" hidden>
    <section id="contact-list">
      <div id="saved-header">
        <div id="milestone">
          <p id="milestone-count"></p>
          <p id="milestone-msg"></p>
        </div>
        <button type="button" id="export-btn" aria-label="Export and share contacts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M16 6l-4-4-4 4"/>
            <path d="M12 2v13"/>
          </svg>
        </button>
      </div>
      <input type="search" id="search" placeholder="Search…" autocomplete="off">
      <ul id="contact-ul"></ul>
    </section>
  </div>

  <div id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
